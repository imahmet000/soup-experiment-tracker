services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soup
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://soup:soup-local-only@db:5432/soup
      SSE_POLL_SECONDS: "0.5"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: soup_test
      POSTGRES_USER: soup_test
      POSTGRES_PASSWORD: soup-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup_test -d soup_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  tests:
    build: .
    profiles: ["test"]
    environment:
      DATABASE_URL: postgres://soup_test:soup-test-only@test-db:5432/soup_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]

volumes:
  postgres_data:
